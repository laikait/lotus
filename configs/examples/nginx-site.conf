# An Nginx configuration to try the translator on:
#
#     lotus compat nginx convert configs/examples/nginx-site.conf
#     lotus compat nginx convert -o site.conf configs/examples/nginx-site.conf
#
# It uses the usual pieces of a PHP site behind HTTPS, an API proxy with a cache,
# and two things LOTUS can't translate (alias, expires), which the report lists.

http {
    gzip on;
    gzip_types text/css application/javascript application/json;

    upstream api { server 127.0.0.1:9001; server 127.0.0.1:9002 weight=2; }
    proxy_cache_path /var/cache/nginx keys_zone=pages:10m max_size=256m;

    server {
        listen 80;
        server_name example.test www.example.test;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name example.test www.example.test;
        ssl_certificate /etc/ssl/example.test.pem;
        ssl_certificate_key /etc/ssl/example.test.key;
        root /var/www/example;
        index index.php index.html;
        error_page 404 /404.html;

        location / { try_files $uri $uri/ /index.php?$args; }
        location ~ \.php$ { fastcgi_pass unix:/run/php/php-fpm.sock; }
        location ^~ /uploads/ { deny all; }
        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_cache pages;
            proxy_cache_valid 200 5m;
        }
        location /downloads/ { alias /srv/files/; expires 7d; }
    }
}
