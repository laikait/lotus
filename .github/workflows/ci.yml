name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly: catches new vulnerabilities and toolchain changes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - run: make fmt-check vet
      - run: make lint
      - run: make vuln

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: ${{ matrix.go }}
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...

  acme:
    name: ACME against Pebble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - name: Install Pebble (Let's Encrypt's test CA) and its mock DNS
        run: |
          mkdir -p "$RUNNER_TEMP/pebble"
          GOBIN="$RUNNER_TEMP/pebble" go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.3
          GOBIN="$RUNNER_TEMP/pebble" go install github.com/letsencrypt/pebble/v2/cmd/pebble-challtestsrv@v2.10.3
          echo "LOTUS_PEBBLE_DIR=$RUNNER_TEMP/pebble" >> "$GITHUB_ENV"
          DIR=$(cd "$RUNNER_TEMP" && go mod download -json github.com/letsencrypt/pebble/v2@v2.10.3 | jq -r .Dir)
          echo "LOTUS_PEBBLE_TESTDIR=$DIR/test" >> "$GITHUB_ENV"
      - name: Certificates over HTTP-01 and TLS-ALPN-01, with the race detector
        run: go test -race -count=1 -run AutomaticCertificates -v ./internal/server

  freebsd:
    name: Test (FreeBSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b
        with:
          usesh: true
          prepare: pkg install -y go
          run: go test -count=1 ./...

  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: stable
      - run: make cross
